<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Game</title>
<script type="text/javascript" src ="scripts/rockPaperScissors.js"></script>

</head>
<body>
<header>
    <h1>Rock Paper Scissors Game</h1>
    <h4>Make your choice below!</h4>
    <p>The result will display as a pop up box.</p>
</header>
<form>
<input type="button" value ="Rock" onClick="rock();">
<input type="button" value ="Paper" onClick="paper();">
<input type="button" value ="Scissors" onClick="scissors();">

</form>
</body>
</html>
